  <script src="assets/js/components.js"></script>
  <script>
    const sector = new URLSearchParams(location.search).get('activite') || 'technologies';
    const pageContent = document.getElementById('page-content');
    const title = document.getElementById('title');
    const sidebar = `<aside class="aside"><h3>Nos activités</h3><a href="secteur.html?activite=technologies">Technologies numériques</a><a href="secteur.html?activite=formation">Formation</a><a href="secteur.html?activite=environnement">Environnement</a><a href="secteur.html?activite=commerce">Commerce général</a><a href="secteur.html?activite=agrobusiness">Agrobusiness</a></aside>`;
    const simpleSectors = {
      environnement: { title:'Environnement', description:'Carri Business inscrit l’environnement parmi ses orientations de développement. Les initiatives et modalités opérationnelles seront communiquées au fur et à mesure de leur confirmation.', items:['Orientation environnementale de l’entreprise','Initiatives à documenter lors de leur mise en œuvre','Approche responsable dans le développement des activités'] },
      commerce: { title:'Commerce général', description:'Le commerce général fait partie des secteurs retenus par Carri Business. Les offres et activités spécifiques seront présentées lorsqu’elles seront confirmées.', items:['Activités commerciales en structuration','Informations à compléter selon les offres disponibles','Développement progressif et responsable'] },
      agrobusiness: { title:'Agrobusiness', description:'Carri Business porte une ambition de développement dans l’agrobusiness. Les activités précises seront communiquées à mesure de leur définition et de leur mise en œuvre.', items:['Orientations agricoles en développement','Démarche progressive','Informations à compléter avec les projets confirmés'] }
    };
    function renderTechnology() {
      document.title = 'Technologies et services numériques | Carri Business';
      title.textContent = 'Technologies et services numériques';
      pageContent.innerHTML = `
        <section class="section"><div class="container technology-intro"><div><span class="eyebrow">Carri Business</span><h2>Des solutions numériques conçues pour les usages concrets.</h2><p class="lead">À travers son secteur Technologies et services numériques, Carri Business conçoit et développe des solutions informatiques destinées à accompagner les entreprises, les professionnels et les organisations dans leur transformation numérique.</p><p>Nos activités couvrent notamment le développement d’applications web et mobiles, la conception de plateformes numériques, les solutions de gestion, l’intelligence artificielle et les services technologiques adaptés aux besoins des utilisateurs.</p><p>Notre approche privilégie l’innovation, la simplicité d’utilisation et la recherche de solutions concrètes aux défis rencontrés dans différents secteurs d’activité.</p></div><figure class="image-block"><img src="assets/images/carri/technology-services.jpg" alt="Écran affichant du code informatique" loading="eager"><figcaption>Photographie illustrative des activités de développement numérique.</figcaption></figure></div></section>
        <section class="section alt"><div class="container"><div class="section-heading"><span class="eyebrow">Expertises</span><h2>Nos domaines d’intervention</h2><p class="lead">Nous mobilisons des compétences complémentaires pour concevoir des solutions numériques utiles et adaptées à leurs contextes d’utilisation.</p></div><div class="domain-grid"><article class="domain-card"><span class="sector-number">01</span><h3>Applications web</h3><p>Applications de gestion, plateformes web, interfaces professionnelles, tableaux de bord et services accessibles sur ordinateur comme sur smartphone.</p></article><article class="domain-card"><span class="sector-number">02</span><h3>Applications mobiles</h3><p>Solutions Android et iOS avec interfaces ergonomiques, connexion à des services web, gestion sécurisée des comptes et synchronisation des données.</p></article><article class="domain-card"><span class="sector-number">03</span><h3>Solutions SaaS</h3><p>Logiciels de gestion en ligne, accès multiutilisateur, droits et autorisations, automatisation des opérations et amélioration continue.</p></article><article class="domain-card"><span class="sector-number">04</span><h3>Intelligence artificielle</h3><p>Exploration de la reconnaissance et du traitement de documents, de l’extraction d’informations, de l’analyse de données et de l’assistance intelligente.</p></article><article class="domain-card"><span class="sector-number">05</span><h3>Digitalisation des processus</h3><p>Centralisation des informations, suivi d’activités, automatisation des tâches répétitives, traçabilité et accès facilité aux données utiles.</p></article><article class="domain-card"><span class="sector-number">06</span><h3>Intégration de services</h3><p>Architecture API, authentification, paiements, notifications et interconnexion avec des services numériques externes.</p></article></div></div></section>
        <section class="section"><div class="container"><div class="section-heading"><span class="eyebrow">Produits numériques</span><h2>Des solutions développées pour répondre à des besoins réels</h2></div><article class="solution-feature"><div class="solution-visual"><img src="assets/images/carri/kisinet-digital.jpg" alt="Téléphone affichant une interface de suivi numérique" loading="lazy"></div><div class="solution-copy"><span class="eyebrow">Kisinet</span><h2>La gestion pharmaceutique, en ligne.</h2><p>Kisinet est une plateforme numérique de gestion des pharmacies développée par Carri Business. Elle vise à faciliter la gestion quotidienne des établissements pharmaceutiques grâce à des outils de suivi des produits, des stocks, des ventes et des opérations de gestion.</p><ul class="service-list"><li>Gestion des produits pharmaceutiques et suivi des stocks</li><li>Gestion des dates de péremption, ventes et activités</li><li>Utilisateurs, rôles et autorisations</li><li>Tableaux de bord de suivi</li><li>Analyse assistée des ordonnances médicales par intelligence artificielle</li></ul><p>L’analyse assistée vise à faciliter le traitement des informations ; elle ne constitue pas un dispositif de diagnostic médical.</p><a class="button" href="https://kisinet.com" target="_blank" rel="noopener noreferrer">Découvrir Kisinet</a></div></article><article class="solution-feature reverse"><div class="solution-visual"><img src="assets/images/carri/digital-network.jpg" alt="Réseau numérique illustrant l'interconnexion de services" loading="lazy"></div><div class="solution-copy"><span class="eyebrow">Loyer360</span><h2>Un projet dédié à la gestion locative.</h2><p>Loyer360 est un projet de solution numérique de Carri Business consacré à la gestion locative. Il vise à contribuer à une meilleure organisation et au suivi des activités liées à la location immobilière.</p><p>Son développement se poursuit et ses fonctionnalités seront présentées lorsqu’elles seront confirmées.</p></div></article></div></section>
        <section class="section alt"><div class="container"><div class="section-heading"><span class="eyebrow">Méthode</span><h2>Une approche centrée sur les besoins</h2></div><div class="process-grid"><article class="process-step-card"><strong>01</strong><h3>Comprendre les besoins</h3><p>Identifier les difficultés rencontrées par les utilisateurs et les organisations.</p></article><article class="process-step-card"><strong>02</strong><h3>Concevoir la solution</h3><p>Définir les fonctionnalités et l’architecture adaptées.</p></article><article class="process-step-card"><strong>03</strong><h3>Développer et tester</h3><p>Construire la solution et vérifier son fonctionnement.</p></article><article class="process-step-card"><strong>04</strong><h3>Améliorer continuellement</h3><p>Faire évoluer les fonctionnalités selon les retours et les besoins.</p></article></div></div></section>
        <section class="section"><div class="container"><div class="section-heading"><span class="eyebrow">Orientations technologiques</span><h2>Des technologies au service des projets.</h2><p class="lead">Nos projets numériques mobilisent les domaines technologiques pertinents selon leurs objectifs et leurs utilisateurs, sans faire de la technologie une fin en soi.</p></div><div class="orientation-list"><span>Développement web</span><span>Développement mobile</span><span>Intelligence artificielle</span><span>Bases de données</span><span>Architecture API</span><span>Cloud et déploiement</span><span>Sécurité et authentification</span><span>Analyse de données</span></div></div></section>
        <section class="section alt"><div class="container"><div class="section-heading"><span class="eyebrow">Nos principes</span><h2>Pourquoi choisir nos solutions&nbsp;?</h2></div><div class="reason-grid"><article class="reason-card"><h3>Adaptation aux besoins locaux</h3><p>Des solutions pensées en tenant compte des réalités des utilisateurs.</p></article><article class="reason-card"><h3>Simplicité d’utilisation</h3><p>Des interfaces accessibles et compréhensibles au quotidien.</p></article><article class="reason-card"><h3>Évolutivité</h3><p>Des plateformes conçues pour intégrer de nouvelles fonctionnalités.</p></article><article class="reason-card"><h3>Sécurité</h3><p>Des mécanismes de protection des comptes et de contrôle des accès intégrés à la conception.</p></article><article class="reason-card"><h3>Innovation utile</h3><p>Des technologies mises au service de problèmes concrets.</p></article></div></div></section>
        <section class="section"><div class="container tech-contact"><span class="eyebrow">Collaboration</span><h2>Vous avez un projet numérique&nbsp;?</h2><p>Carri Business s’intéresse aux projets qui utilisent les technologies numériques pour améliorer les activités des entreprises et des organisations. Contactez-nous pour échanger sur vos besoins et les possibilités de collaboration.</p><a class="button" href="contact.html">Nous contacter</a></div></section>`;
    }
    function renderTraining() {
      document.title = 'Formation et développement des compétences | Carri Business';
      title.textContent = 'Formation et développement des compétences';
      pageContent.innerHTML = `
        <section class="section"><div class="container technology-intro"><div><span class="eyebrow">Carri Business</span><h2>Faire de la formation un levier de développement.</h2><p class="lead">Chez Carri Business, nous considérons la formation comme un levier essentiel du développement personnel, professionnel et économique.</p><p>À travers Djana Academy, notre structure dédiée à la formation, nous contribuons au développement des compétences numériques en proposant une approche pédagogique orientée vers la compréhension, la pratique et l’application concrète des connaissances.</p><p>Notre ambition est de rendre les compétences technologiques plus accessibles et d’accompagner les apprenants dans leur adaptation aux évolutions du monde numérique.</p></div><figure class="image-block"><img src="assets/images/carri/training-digital-skills.jpg" alt="Espace de travail avec ordinateurs et outils numériques" loading="eager"><figcaption>Photographie illustrative d’un environnement de travail numérique.</figcaption></figure></div></section>
        <section class="section alt"><div class="container"><div class="academy-feature"><div class="academy-feature-identity"><img src="assets/images/logo%20simply.jpg" alt="Logo officiel Djana Academy"><p>Une activité de formation de Carri Business</p></div><div class="academy-feature-copy"><span class="eyebrow">Djana Academy</span><h2>Apprendre sans limites. Construire le futur numérique.</h2><p>Djana Academy accompagne le développement des connaissances et des compétences dans les domaines informatiques et numériques.</p><p>Son approche met en valeur l’apprentissage des technologies, les compétences pratiques, l’accompagnement pédagogique, l’autonomie des apprenants et la préparation aux réalités du monde professionnel.</p><p>Elle encourage également une culture de l’apprentissage continu, essentielle dans un environnement numérique en évolution.</p></div></div></div></section>
        <section class="section"><div class="container"><div class="section-heading"><span class="eyebrow">Compétences numériques</span><h2>Nos domaines de formation</h2><p class="lead">Ces domaines représentent les principales familles de compétences que Djana Academy peut aborder dans ses activités pédagogiques. Les contenus et parcours proposés évoluent selon les programmes disponibles.</p></div><div class="domain-grid"><article class="domain-card"><span class="sector-number">01</span><h3>Informatique fondamentale</h3><p>Initiation à l’informatique, fonctionnement des ordinateurs, systèmes d’exploitation, fichiers, outils informatiques et culture numérique.</p></article><article class="domain-card"><span class="sector-number">02</span><h3>Bureautique et outils professionnels</h3><p>Traitement de texte, tableurs, présentations, organisation documentaire, productivité et collaboration numérique pour les études et le travail.</p></article><article class="domain-card"><span class="sector-number">03</span><h3>Programmation et développement web</h3><p>Introduction à la programmation, algorithmique, technologies web et projets pratiques pour développer la logique et la résolution de problèmes.</p></article><article class="domain-card"><span class="sector-number">04</span><h3>Bases de données</h3><p>Concepts fondamentaux, modélisation de l’information, bases relationnelles, SQL, manipulation des données et notions d’administration.</p></article><article class="domain-card"><span class="sector-number">05</span><h3>Réseaux et systèmes</h3><p>Fondamentaux des réseaux, communication entre équipements, adressage, systèmes informatiques, administration de base et sécurité numérique.</p></article><article class="domain-card"><span class="sector-number">06</span><h3>IA et analyse de données</h3><p>Domaine d’évolution pédagogique : introduction à l’IA, données, apprentissage automatique, usages concrets et utilisation responsable des outils.</p></article></div></div></section>
        <section class="section alt"><div class="container"><div class="section-heading"><span class="eyebrow">Publics</span><h2>Des compétences pour différents profils</h2></div><div class="audience-grid"><article class="audience-card"><h3>Étudiants et élèves</h3><p>Développer des connaissances informatiques et se préparer aux exigences académiques et professionnelles.</p></article><article class="audience-card"><h3>Jeunes diplômés</h3><p>Renforcer les compétences pratiques et explorer de nouvelles perspectives professionnelles.</p></article><article class="audience-card"><h3>Professionnels</h3><p>Actualiser les compétences numériques et mieux utiliser les outils informatiques dans les activités professionnelles.</p></article><article class="audience-card"><h3>Entrepreneurs</h3><p>Acquérir des repères utiles pour mobiliser les technologies dans la gestion et le développement des activités économiques.</p></article></div></div></section>
        <section class="section"><div class="container"><div class="section-heading"><span class="eyebrow">Pédagogie</span><h2>Apprendre, pratiquer et progresser</h2></div><div class="process-grid"><article class="process-step-card"><strong>01</strong><h3>Comprendre</h3><p>Acquérir les notions fondamentales et comprendre les concepts avant de passer à leur application.</p></article><article class="process-step-card"><strong>02</strong><h3>Pratiquer</h3><p>Renforcer les connaissances avec des exercices, démonstrations et activités pratiques.</p></article><article class="process-step-card"><strong>03</strong><h3>Réaliser</h3><p>Mettre les connaissances en application dans des situations concrètes et, selon le programme, des projets.</p></article><article class="process-step-card"><strong>04</strong><h3>Progresser</h3><p>Encourager l’apprentissage continu, l’autonomie et l’amélioration des compétences.</p></article></div></div></section>
        <section class="section alt"><div class="container"><div class="section-heading"><span class="eyebrow">Enjeux</span><h2>Les compétences numériques au cœur des transformations professionnelles</h2><p class="lead">La compréhension et l’utilisation des outils numériques contribuent à mieux participer aux évolutions des études, des métiers et des initiatives économiques.</p></div><div class="reason-grid"><article class="reason-card"><h3>Employabilité</h3><p>Renforcer des compétences utiles dans de nombreux métiers.</p></article><article class="reason-card"><h3>Productivité</h3><p>Mieux utiliser les outils informatiques dans les activités quotidiennes.</p></article><article class="reason-card"><h3>Entrepreneuriat</h3><p>Mobiliser les technologies pour développer des initiatives économiques.</p></article><article class="reason-card"><h3>Autonomie</h3><p>Apprendre à utiliser et mieux comprendre les outils numériques.</p></article><article class="reason-card"><h3>Innovation et adaptabilité</h3><p>Acquérir des repères pour concevoir, comprendre et suivre les évolutions technologiques.</p></article></div></div></section>
        <section class="section"><div class="container"><div class="section-heading"><span class="eyebrow">Engagements</span><h2>Notre vision de la formation</h2></div><div class="reason-grid"><article class="reason-card"><h3>Accessibilité</h3><p>Favoriser l’accès aux connaissances et aux compétences numériques.</p></article><article class="reason-card"><h3>Qualité pédagogique</h3><p>Privilégier des explications structurées, progressives et compréhensibles.</p></article><article class="reason-card"><h3>Apprentissage pratique</h3><p>Encourager l’application des connaissances par des exercices et situations concrètes.</p></article><article class="reason-card"><h3>Accompagnement</h3><p>Accorder de l’importance à la progression des apprenants.</p></article><article class="reason-card"><h3>Évolution des compétences</h3><p>Adapter progressivement les orientations pédagogiques aux transformations du numérique.</p></article></div></div></section>
        <section class="section alt"><div class="container academy-context"><div><img src="assets/images/carri/training-digital-skills.jpg" alt="Postes de travail numériques illustrant l'apprentissage des outils informatiques" loading="lazy"></div><div class="academy-context-copy"><span class="eyebrow">République démocratique du Congo</span><h2>Contribuer au développement des compétences en RDC</h2><p>Le développement des compétences numériques constitue un enjeu important pour les étudiants, les professionnels, les entreprises et les entrepreneurs congolais.</p><p>À travers Djana Academy, Carri Business souhaite contribuer à l’apprentissage des outils numériques, au développement des compétences techniques, à l’appropriation des nouvelles technologies et au renforcement de l’autonomie.</p><p>Cette démarche vise aussi à encourager une utilisation du numérique attentive aux besoins locaux.</p></div></div></section>
        <section class="section"><div class="container tech-contact"><span class="eyebrow">Échangeons</span><h2>Développons les compétences ensemble</h2><p>Vous souhaitez développer vos compétences numériques ou échanger sur un projet de formation ? Djana Academy, structure de formation de Carri Business, vous invite à prendre contact pour découvrir ses activités et explorer les possibilités d’apprentissage ou de collaboration.</p><div class="hero-actions"><a class="button" href="contact.html">Nous contacter</a><a class="button ghost" href="djana-academy.html">Découvrir Djana Academy</a></div></div></section>`;
    }
    function renderSimple(item) {
      title.textContent = item.title;
      document.title = item.title + ' | Carri Business';
      pageContent.innerHTML = `<section class="section"><div class="container content-grid"><article><span class="eyebrow">Carri Business</span><h2>${item.title}</h2><p class="lead">${item.description}</p><h3>Repères</h3><ul class="service-list">${item.items.map(value => `<li>${value}</li>`).join('')}</ul></article>${sidebar}</div></section>`;
    }
    if (sector === 'technologies') renderTechnology();
    else if (sector === 'formation') renderTraining();
    else renderSimple(simpleSectors[sector] || simpleSectors.environnement);
  </script>
</body>
</html>
